[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Production is the Supabase-backed bundle. Demo builds are the preview surface
# only. `postbuild` (scripts/ci/verify-build.mjs) refuses a demo-mode production
# deploy even if this file is overridden in the Netlify UI, so a missing or
# stale VITE_DATA_MODE cannot ship the demo PIN and identities.
[context.production.environment]
  VITE_DATA_MODE = "supabase"

[context.deploy-preview.environment]
  VITE_DATA_MODE = "demo"

[context.branch-deploy.environment]
  VITE_DATA_MODE = "demo"

# Keep future client-side routes working on a static host.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

# Always revalidate the HTML shell so a new deploy can select its current
# hashed JavaScript and image assets. Vite asset filenames are content-hashed,
# so those immutable files can safely receive a long cache lifetime.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
